[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-hercules"
version = "0.1.0"
description = "Benchmark for evaluating LLMs' ability to write high-performance CUDA kernels"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy",
    "toml",
    "scipy",
    "tiktoken",
]

[project.optional-dependencies]
agent = [
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-prebuilt>=1.0.0",
]
dev = [
    "pytest",
]
class3-large = [
    "ogb",
]

[project.scripts]
cuda-hercules = "cuda_hercules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
