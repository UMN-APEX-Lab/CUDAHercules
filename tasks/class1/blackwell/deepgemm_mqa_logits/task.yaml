schema_version: 1
task_id: class1/blackwell/deepgemm_mqa_logits
name: deepgemm_mqa_logits
task_class: 1
domain: ml
tags:
  - attention
  - mqa
  - fp8
hardware:
  min_sm: 100
  tested_sms:
    - 100
  required_features: []
runner:
  backend: class1_make
  workdir: tasks/class1/blackwell/deepgemm_mqa_logits
  timeout_sec: 300
  env:
    KH_BENCHMARK: "20"
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
    atol: 0.01
    rtol: 0.01
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: 'Kernel time:\s*([0-9.]+)\s*ms'
    ref_time_ms_regex: 'Ref time:\s*([0-9.]+)\s*ms'
  metric: speedup_ref_over_sol
source:
  repo: deepseek-ai/DeepGEMM
  files: []
  commit: ""
  license: MIT
anti_cheat:
  blocked_patterns:
    - '#include\s*[<"]deep_gemm'
    - 'deep_gemm::'
  required_patterns:
    - '__global__\s+void'
    - '<<<.*>>>'
