schema_version: 1
task_id: class1/general/21_quaternion_gemm
name: 21_quaternion_gemm
task_class: 1
domain: ml
tags:
- gemm
hardware:
  min_sm: 80
  tested_sms:
  - 80
  required_features: []
runner:
  backend: class1_make
  workdir: tasks/class1/general/21_quaternion_gemm
  timeout_sec: 180
  env:
    KH_BENCHMARK: '20'
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
    atol: 0.01
    rtol: 0.01
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
  metric: speedup_ref_over_sol
source:
  repo: NVIDIA/cutlass
  files: []
  commit: ''
  license: BSD-3-Clause
anti_cheat:
  # Precision floor: the task is FP32. TF32, FP16, BF16, FP8 and INT8 compute (incl. tensor-core
  # paths) is below spec and is not allowed even if it passes tolerance; header includes alone
  # are fine.
  blocked_patterns:
  - '\.tf32\b'
  - '\bprecision::tf32\b'
  - '\b__float_to_tf32\b'
  - '\btfloat32_t\b'
  - '\b__(half2?|nv_bfloat162?|nv_fp8\w*|nv_fp6\w*|nv_fp4\w*)\b'
  - '__float2(half|bfloat16)|__(half|bfloat16)2float'
  - '\bcutlass::(half_t|bfloat16_t|float_e4m3_t|float_e5m2_t|float_e2m1_t|float_e3m2_t|float_e2m3_t)\b'
  - '\.(b?f16)(x2)?\b'
  - '\.e[2-5]m[1-3](x2)?\b'
  - '\.[su](4|8)\.[su](4|8)\b'
  - '\b__dp4a\b'
  - ',\s*half\s*,'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
