schema_version: 1
task_id: class1/general/35_gemm_softmax
name: 35_gemm_softmax
task_class: 1
domain: ml
tags:
- gemm
- softmax
hardware:
  min_sm: 80
  tested_sms:
  - 80
  - 120
  required_features: []
runner:
  backend: class1_make
  workdir: tasks/class1/general/35_gemm_softmax
  timeout_sec: 300
  env:
    KH_BENCHMARK: '20'
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
  # Checked by the harness: D |x - ref| <= 1e-3 + 2e-3 |ref|; Softmax <= 1e-6 + 1.5e-2 |ref|, row sums 1 +- 1e-3
    atol: 1.0e-03
    rtol: 2.0e-03
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
  metric: speedup_ref_over_sol
source:
  repo: NVIDIA/cutlass
  files: []
  commit: ''
  license: BSD-3-Clause
anti_cheat:
  blocked_patterns:
  # Precision floor: FP16 data, FP32 accumulation, FP32 softmax / LayerNorm math. FP8/FP6/FP4,
  # INT8/INT4, BF16 and FP16-accumulating MMA/FMA are below the spec and not allowed even if they
  # pass the tolerance (header includes alone are fine).
  - '\b__nv_fp8\w*|\b__nv_fp6\w*|\b__nv_fp4\w*'
  - '\b(float_e[2-5]m[1-3]_t|float_ue[48]m[03]_t|u?int4b_t)\b'
  - '\.e[2-5]m[1-3](x[24])?\b'
  - '\.[su](4|8)\.[su](4|8)\b'
  - '\b__dp[24]a\b'
  - '\b__nv_bfloat162?\b|__float2bfloat16|__bfloat162float|\bbfloat16_t\b|\.bf16(x2)?\b'
  - '\.f16\.f16\.f16\.f16\b|F16F16F16F16'
  - '\b__hfma2?\b|\bfma\.rn[.a-z]*\.(b?f16)(x2)?\b'
  # Reference / golden kernels compiled into the harness
  - '\bkh_(ref|golden)_'
  - '\bGemmSoftmax\b|\bApplySoftmax\b|EpilogueVisitorSoftmax|ApplySoftmaxFinalReduction'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
