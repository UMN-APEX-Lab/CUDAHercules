schema_version: 1
task_id: class1/general/25_ampere_fprop_mainloop_fusion
name: 25_ampere_fprop_mainloop_fusion
task_class: 1
domain: ml
tags: []
hardware:
  min_sm: 80
  tested_sms:
  - 80
  - 120
  required_features: []
runner:
  backend: class1_make
  workdir: tasks/class1/general/25_ampere_fprop_mainloop_fusion
  timeout_sec: 180
  env:
    KH_BENCHMARK: '20'
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
    atol: 0.01
    rtol: 0.01
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
  metric: speedup_ref_over_sol
source:
  repo: NVIDIA/cutlass
  files: []
  commit: ''
  license: BSD-3-Clause
anti_cheat:
  # Precision floor: FP16-precision operands accumulated in FP32. FP16 accumulation (incl.
  # f16-accumulating MMA / wmma fragments), BF16, FP8/FP6/FP4 and INT8/INT4 compute are below the
  # task precision and are not allowed even if they pass the tolerance. FP16 arithmetic itself is
  # not blocked here because the fused scale+bias+ReLU may legitimately be computed in FP16;
  # FP16-rounded products / FP16 partial sums are left to the audit. Header includes alone are fine.
  blocked_patterns:
  - '\b__nv_bfloat162?\b'
  - '__float2bfloat16|__bfloat162float|\bcutlass::bfloat16_t\b'
  - '\b__nv_fp8\w*|\b__nv_fp6\w*|\b__nv_fp4\w*'
  - '\bcutlass::(float_e4m3_t|float_e5m2_t|float_e2m1_t|float_e3m2_t|float_e2m3_t|int4b_t|uint4b_t)\b'
  - '\.bf16(x2)?\b'
  - '\.e[2-5]m[1-3](x2)?\b'
  - '\.[su](4|8)\.[su](4|8)\b'
  - '\b__dp[24]a\b'
  - '\bprecision::(s4|u4|b1)\b'
  - '\.f16\.f16\.f16\.f16\b'
  - 'accumulator\s*,\s*\w+\s*,\s*\w+\s*,\s*\w+\s*,\s*(__half|half|cutlass::half_t)\s*>'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
