schema_version: 1
task_id: class1/general/05_batched_gemm
name: 05_batched_gemm
task_class: 1
domain: ml
tags:
- gemm
hardware:
  min_sm: 80
  tested_sms:
  - 80
  - 120
  required_features: []
runner:
  backend: class1_make
  workdir: tasks/class1/general/05_batched_gemm
  timeout_sec: 300
  env:
    KH_BENCHMARK: '20'
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
  # Checked by the harness: |C - ref| <= 3e-5 * (|alpha| * sqrt(K) + |beta|) per element
    atol: 3.0e-05
    rtol: 0.0
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
  metric: speedup_ref_over_sol
source:
  repo: NVIDIA/cutlass
  files: []
  commit: ''
  license: BSD-3-Clause
anti_cheat:
  blocked_patterns:
  # Precision floor: FP32 SIMT arithmetic. TF32 tensor cores (including 3xTF32 split schemes),
  # FP16/BF16/FP8/INT8 compute are below the spec and not allowed even if they pass the tolerance
  # (header includes alone are fine).
  - '\b__(half2?|nv_bfloat162?|nv_fp8\w*|nv_fp6\w*|nv_fp4\w*)\b'
  - '__float2(half|bfloat16)|__(half|bfloat16)2float'
  - '\b(half_t|bfloat16_t|tfloat32_t|float_e[2-5]m[1-3]_t|float_ue[48]m[03]_t|u?int4b_t)\b'
  - '\.(b?f16)(x2)?\b'
  - '\.e[2-5]m[1-3](x[24])?\b'
  - '\.[su](4|8)\.[su](4|8)\b'
  - '\b__dp[24]a\b'
  - ',\s*half\s*,'
  - '\.tf32\b|precision::tf32|__float_to_tf32|tfloat32|TF32TF32|F16F16'
  # Reference / golden kernels compiled into the harness
  - '\bkh_(ref|golden)_|\bGemmBatched\b|\bGemmArray\b'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
