schema_version: 1
task_id: class1/general/05_batched_gemm
name: 05_batched_gemm
task_class: 1
domain: ml
tags:
- gemm
hardware:
  min_sm: 80
  tested_sms:
  - 80
  - 120
  required_features: []
runner:
  backend: class1_make
  workdir: tasks/class1/general/05_batched_gemm
  timeout_sec: 300
  env:
    KH_BENCHMARK: '20'
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
  # Checked by the harness: |C - ref| <= 3e-5 * (|alpha| * sqrt(K) + |beta|) per element
    atol: 3.0e-05
    rtol: 0.0
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
  metric: speedup_ref_over_sol
source:
  repo: NVIDIA/cutlass
  files: []
  commit: ''
  license: BSD-3-Clause
anti_cheat:
  # FP32 accuracy is enforced by the tolerance; FP32 emulation with lower-precision
  # units is allowed, so there is no precision-floor pattern here.
  blocked_patterns:
  # Reference / golden kernels compiled into the harness
  - '\bkh_(ref|golden)_|\bGemmBatched\b|\bGemmArray\b'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
