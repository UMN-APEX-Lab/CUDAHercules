schema_version: 1
task_id: class1/hopper/88_hopper_fmha
name: 88_hopper_fmha
task_class: 1
domain: ml
tags:
- attention
hardware:
  min_sm: 90
  tested_sms:
  - 90
  required_features:
  - sm_90a
runner:
  backend: class1_make
  workdir: tasks/class1/hopper/88_hopper_fmha
  timeout_sec: 180
  env:
    KH_BENCHMARK: '20'
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
    atol: 0.01
    rtol: 0.01
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
  metric: speedup_ref_over_sol
source:
  repo: NVIDIA/cutlass
  files: []
  commit: ''
  license: BSD-3-Clause
anti_cheat:
  blocked_patterns:
  - '#include\s*[<"][^">]*(?:reference|harness|common\.cuh|hopper_validation|hopper_gemm_oracle|solution_api|\.\.)'
  - \b(?:__nv_fp8\w*|float_e[45]m[23]_t)\b
  - cvt\.[^;\n]*\.(?:e4m3|e5m2)
  - \b(?:__nv_fp4\w*|float_e2m1_t)\b
  - cvt\.[^;\n]*\.e2m1
  - \b(?:Cutlass(?:Gemm|Gett)\w*|RunCutlassReference|reference_gemm\w*|kh_\w+|launch_tk_rotary|inner_run|run_ref_kernel|based_init|la_init|hedgehog_init|la_kernel|based_linear_attention|hedgehog_linear_attention_smd)\b
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
