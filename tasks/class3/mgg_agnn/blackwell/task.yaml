schema_version: 1
task_id: class3/mgg_agnn/blackwell
name: mgg_agnn
task_class: 3
domain: ml
tags:
- attention
- gnn
- spmm
- sddmm
- cosine-similarity
- training
- blackwell
hardware:
  min_sm: 100
  tested_sms:
  - 100
  required_features: []
runner:
  backend: class3_app
  workdir: tasks/class3/mgg_agnn
  timeout_sec: 600
  env:
    KH_BENCHMARK: '200'
    CUDA_GENCODE: -gencode arch=compute_100a,code=sm_100a
  solution_files:
  - solution.cu
  - wrapper.cpp
build:
  cmd: ''
  clean_cmd: ''
execute:
  cmd: python run.py
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
    atol: 0.5
    rtol: 0.05
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
    speedup_regex: Speedup:\s*([0-9.]+)x
    loss_ratio_regex: Loss ratio:\s*([0-9.]+)
  metric: speedup
  training_quality:
    ref_loss_regex: Ref loss:\s*([0-9.]+)\s*->\s*([0-9.]+)
    solution_loss_regex: Solution loss:\s*([0-9.]+)\s*->\s*([0-9.]+)
source:
  repo: YukeWang96/MGG-OSDI23-AE
  files: []
  commit: ''
  license: ''
anti_cheat:
  blocked_patterns: []
  required_patterns:
  - __global__\s+void
  - <<<.*>>>

hacking_hints: |
  Attention-aware GNN kernel must compute attention scores per edge and
  aggregate accordingly. Multi-graph partitioning must be respected.
  Flags:
  - Returning zeros or uniform-weighted mean (bypassing attention)
  - Hardcoded attention coefficients
  - Skipping the attention normalization step
