anti_cheat:
  blocked_patterns:
  # Reference kernel headers
  - '#include\s*[<"]ln_fwd'
  - '#include\s*[<"]ln_bwd'
  - '#include\s*[<"]ln_parallel'
  - '#include\s*[<"][^>"]*(reference_sources|layer_norm/|\bln_utils|\bln_kernel_traits|\bln\.h)'
  # Precision floor: BF16 is only the storage format (BF16<->FP32 conversions are
  # allowed); all arithmetic must be FP32. What a regex cannot see (C++ operators on
  # __nv_bfloat16 / cutlass::bfloat16_t, bit-level emulation) is left to the audit.
  # FP16 types and conversions (__half, __float2half, ...; BF16 ones allowed)
  - '\b__(?!\w*bfloat16)\w*half\w*'
  # FP8/FP6/FP4 types and conversions
  - '\b__nv_(fp8|fp6|fp4|cvt_)\w*'
  - '\b(cutlass|cute)::(half_t|tfloat32_t|float_e[2-5]m[1-3]_t|float_ue[48]m[03]_t|u?int4b_t)\b'
  # FP16/BF16 arithmetic intrinsics (__hadd, __hmul2, __hfma2, ...)
  - '\b__h(add|sub|mul|fma|div|neg|abs|max|min|cmadd)\w*|\b__h2div\b'
  # FP16/BF16 math intrinsics (hsqrt, h2exp, ...)
  - '\bh2?(sqrt|rsqrt|rcp|exp|exp2|exp10|log|log2|log10|sin|cos|tanh|ceil|floor|trunc|rint)\s*\('
  # FP16/BF16 arithmetic in inline PTX (cvt to/from bf16 is allowed)
  - '(?<![.\w])(add|sub|mul|fma|neg|abs|min|max|div|rcp|sqrt|rsqrt|ex2|lg2|tanh|sin|cos|set|setp|cmp|testp|copysign)(\.\w+)*\.b?f16(x2)?\b'
  # FP16 conversion in inline PTX
  - '\bcvt(\.\w+)*\.f16(x2)?\b'
  - '\.tf32\b|\bwmma::precision::tf32\b|__float_to_tf32'
  - '\.(e[2-5]m[1-3]|ue8m0|ue4m3)(x2|x4)?\b'
  # int8/int4 MMA
  - '\.[su](4|8)\.[su](4|8)\b'
  - '\b__dp[24]a\w*'
  # tensor-core MMA (not needed for LayerNorm)
  - '\bwmma::|\b(mma|wgmma)\.(sync|mma_async)\b|\btcgen05\.mma\b|\bMMA_Atom\b|\bmake_tiled_mma\b|\bSM[0-9]+_[0-9]+x[0-9]+x[0-9]+_\w+'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
