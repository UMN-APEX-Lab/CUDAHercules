  - '\b__nv_fp8\w*|\b__nv_fp6\w*|\b__nv_fp4\w*|\b__nv_cvt_\w*fp8\w*'
  - '\bcutlass::(float_e4m3_t|float_e5m2_t|float_e2m1_t|float_e3m2_t|float_e2m3_t|float_ue8m0_t|float_ue4m3_t)\b'
  - '\.e[2-5]m[1-3](x[24])?\b'
  - '\.[su](4|8)\.[su](4|8)\b'
  - '\b__dp4a\b|\b__dp2a_(lo|hi)\b'
  - '\.f16\.f16\.f16\.f16\b'
  - '\baccumulator\s*,\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*(half|__half)\b'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
