schema_version: 1
task_id: class2/blackwell/tk_hedgehog
name: tk_hedgehog
task_class: 2
domain: ml
tags:
- linear-attention
- sliding-window
- bf16
- thunderkittens
hardware:
  min_sm: 100
  tested_sms:
  - 100
  required_features: []
runner:
  backend: class1_make
  workdir: tasks/class2/blackwell/tk_hedgehog
  timeout_sec: 600
  env:
    KH_BENCHMARK: '20'
  solution_file: solution.h
build:
  cmd: make test
  clean_cmd: make clean
execute:
  cmd: ./test
  success:
    exit_code: 0
    stdout_regex: Passed
correctness:
  mode: stdout_or_exit
  tolerances:
    atol: 0.01
    rtol: 0.01
performance:
  enabled: true
  parser:
    kernel_time_ms_regex: Kernel time:\s*([0-9.]+)\s*ms
    ref_time_ms_regex: Ref time:\s*([0-9.]+)\s*ms
  metric: speedup_ref_over_sol
source:
  repo: HazyResearch/ThunderKittens
  files: []
  commit: ''
  license: Apache-2.0
anti_cheat:
  # Static check: only blatant cheating (wrapping the reference implementation). Calls to cuBLAS /
  # cuDNN / CUTLASS kernel templates are blocked by the global rules; numeric precision is enforced by
  # the run-time tolerance, not by patterns.
  blocked_patterns:
  - '#include\s*[<\"]kittens'
  - 'kittens::'
  required_patterns:
  - __global__\s+void
  - <<<.*>>>
